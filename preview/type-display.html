<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; background: var(--bg-primary); padding: 28px 32px; }
  .eyebrow { font-family: var(--font-sans); font-size: 11px; font-weight: 600; letter-spacing: 0.15em; text-transform: uppercase; color: var(--fg-accent); margin-bottom: 12px; }
  .hero { font-family: var(--font-display); font-size: 52px; font-weight: 500; line-height: 1.1; letter-spacing: -0.02em; color: var(--color-navy-800); margin: 0 0 8px; }
  .hero em { font-style: italic; color: var(--color-gold-600); }
  .sub { font-family: var(--font-display); font-size: 28px; font-weight: 400; font-style: italic; color: var(--fg-secondary); margin: 0; line-height: 1.3; }
</style>
</head>
<body>
  <div class="eyebrow">Playfair Display — Display Typeface</div>
  <div class="hero">Driving Growth by <em>Mergers</em></div>
  <div class="hero" style="font-size:52px">& Acquisitions</div>
  <div class="sub" style="margin-top:16px">Partnering with exceptional companies</div>
</body>
</html>
