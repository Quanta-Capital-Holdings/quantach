<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; background: var(--bg-primary); padding: 20px 28px; }
  .scale-row { display: flex; align-items: baseline; gap: 14px; border-bottom: 1px solid var(--border-default); padding: 7px 0; }
  .scale-meta { font-family: var(--font-mono); font-size: 9px; color: var(--fg-secondary); width: 80px; flex-shrink: 0; }
  .scale-text { font-family: var(--font-display); color: var(--color-navy-800); line-height: 1.2; }
</style>
</head>
<body>
  <div class="scale-row"><span class="scale-meta">5xl · 76px</span><span class="scale-text" style="font-size:52px;letter-spacing:-0.03em">Quanta</span></div>
  <div class="scale-row"><span class="scale-meta">4xl · 61px</span><span class="scale-text" style="font-size:44px;letter-spacing:-0.03em">Capital</span></div>
  <div class="scale-row"><span class="scale-meta">3xl · 49px</span><span class="scale-text" style="font-size:36px;letter-spacing:-0.02em">Holdings Inc.</span></div>
  <div class="scale-row"><span class="scale-meta">2xl · 39px</span><span class="scale-text" style="font-size:28px;letter-spacing:-0.02em">Strategic M&A</span></div>
  <div class="scale-row"><span class="scale-meta">xl · 31px</span><span class="scale-text" style="font-size:22px">Business Acquisitions</span></div>
  <div class="scale-row"><span class="scale-meta">lg · 25px</span><span class="scale-text" style="font-size:18px">Unlock full potential</span></div>
  <div class="scale-row"><span class="scale-meta">md · 20px</span><span class="scale-text" style="font-size:15px;font-family:var(--font-sans);font-weight:300">Partner with exceptional companies</span></div>
  <div class="scale-row"><span class="scale-meta">base · 16px</span><span class="scale-text" style="font-size:13px;font-family:var(--font-sans);font-weight:400">We drive growth through strategic acquisitions</span></div>
</body>
</html>
