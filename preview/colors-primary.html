<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; background: var(--bg-primary); font-family: var(--font-sans); padding: 20px; }
  .row { display: flex; gap: 0; height: 60px; border-radius: var(--radius-md); overflow: hidden; margin-bottom: 16px; box-shadow: var(--shadow-sm); }
  .swatch { flex: 1; display: flex; align-items: flex-end; padding: 6px 8px; }
  .swatch span { font-size: 10px; font-family: var(--font-mono); font-weight: 500; }
  .label-row { display: flex; gap: 12px; margin-bottom: 4px; }
  .group-label { font-size: 10px; letter-spacing: 0.12em; text-transform: uppercase; font-weight: 600; color: var(--fg-secondary); margin-bottom: 6px; }
</style>
</head>
<body>
<div class="group-label">Navy Scale</div>
<div class="row">
  <div class="swatch" style="background:#071529"><span style="color:#7AAAD4">900</span></div>
  <div class="swatch" style="background:#0B1F3A"><span style="color:#7AAAD4">800 ●</span></div>
  <div class="swatch" style="background:#122948"><span style="color:#7AAAD4">700</span></div>
  <div class="swatch" style="background:#1A3A60"><span style="color:#B0CDE6">600</span></div>
  <div class="swatch" style="background:#2A527F"><span style="color:#B0CDE6">500</span></div>
  <div class="swatch" style="background:#4A7AAF"><span style="color:#EEF5FB">400</span></div>
  <div class="swatch" style="background:#7AAAD4"><span style="color:#0B1F3A">300</span></div>
  <div class="swatch" style="background:#B0CDE6"><span style="color:#0B1F3A">200</span></div>
  <div class="swatch" style="background:#D8E8F4"><span style="color:#0B1F3A">100</span></div>
  <div class="swatch" style="background:#EEF5FB"><span style="color:#0B1F3A">50</span></div>
</div>

<div class="group-label" style="margin-top:8px">Gold Scale</div>
<div class="row">
  <div class="swatch" style="background:#6B4A05"><span style="color:#EAD49A">900</span></div>
  <div class="swatch" style="background:#8B6210"><span style="color:#EAD49A">800</span></div>
  <div class="swatch" style="background:#A87A1A"><span style="color:#F2E5BC">700</span></div>
  <div class="swatch" style="background:#C4922A"><span style="color:#F2E5BC">600 ●</span></div>
  <div class="swatch" style="background:#D4A84A"><span style="color:#6B4A05">500</span></div>
  <div class="swatch" style="background:#DFC070"><span style="color:#6B4A05">400</span></div>
  <div class="swatch" style="background:#EAD49A"><span style="color:#6B4A05">300</span></div>
  <div class="swatch" style="background:#F2E5BC"><span style="color:#6B4A05">200</span></div>
  <div class="swatch" style="background:#F8F2DC"><span style="color:#8B6210">100</span></div>
  <div class="swatch" style="background:#FDFAF0"><span style="color:#8B6210">50</span></div>
</div>
</body>
</html>
