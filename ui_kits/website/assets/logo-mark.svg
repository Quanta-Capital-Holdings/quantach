<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Navy rounded-square background -->
  <rect width="100" height="100" rx="22" fill="#0B1F3A"/>
  <!-- Hairline gold border -->
  <rect x="3" y="3" width="94" height="94" rx="19" fill="none" stroke="#C4922A" stroke-width="1" opacity="0.5"/>
  <!-- Q arc: center (50,46) r=22, gap from ~55° to ~85° (lower-right) -->
  <!-- 55°: (62.6, 64.0)   85°: (51.9, 67.9) -->
  <path d="M 51.9 67.9 A 22 22 0 1 1 62.6 64.0"
        fill="none" stroke="#FFFFFF" stroke-width="8.5" stroke-linecap="round"/>
  <!-- Q tail: gold diagonal crossing through the gap -->
  <line x1="55" y1="60" x2="74" y2="78"
        stroke="#C4922A" stroke-width="8.5" stroke-linecap="round"/>
</svg>
