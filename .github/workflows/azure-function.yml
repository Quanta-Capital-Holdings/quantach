name: Deploy Function App

on:
  push:
    branches: [master]
    paths:
      - 'deployment/azure-function/**'
      - '.github/workflows/azure-function.yml'
  workflow_dispatch:

env:
  PROJECT_PATH: deployment/azure-function/Quanta.Forms.csproj
  DOTNET_VERSION: '10.0.x'
  STORAGE_ACCOUNT: stquantachforms
  DEPLOY_CONTAINER: deployments
  RESOURCE_GROUP: GenericForms

permissions:
  id-token: write
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore ${{ env.PROJECT_PATH }}

      - name: Build
        run: dotnet build ${{ env.PROJECT_PATH }} -c Release --no-restore

      - name: Publish
        run: dotnet publish ${{ env.PROJECT_PATH }} -c Release --no-build -o publish

      - name: Zip publish output
        run: cd publish && zip -r ${{ github.workspace }}/function.zip .

      - name: Login to Azure (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Upload zip to blob storage
        run: |
          az storage container create \
            --name ${{ env.DEPLOY_CONTAINER }} \
            --account-name ${{ env.STORAGE_ACCOUNT }} \
            --auth-mode login \
            --output none 2>/dev/null || true

          az storage blob upload \
            --account-name ${{ env.STORAGE_ACCOUNT }} \
            --container-name ${{ env.DEPLOY_CONTAINER }} \
            --name function-${{ github.sha }}.zip \
            --file ${{ github.workspace }}/function.zip \
            --auth-mode login \
            --overwrite

      - name: Generate SAS URL and set WEBSITE_RUN_FROM_PACKAGE
        run: |
          ACCOUNT_KEY=$(az storage account keys list \
            --account-name ${{ env.STORAGE_ACCOUNT }} \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --query "[0].value" -o tsv)

          EXPIRY=$(date -u -d "5 years" '+%Y-%m-%dT%H:%MZ')

          SAS=$(az storage blob generate-sas \
            --account-name ${{ env.STORAGE_ACCOUNT }} \
            --container-name ${{ env.DEPLOY_CONTAINER }} \
            --name function-${{ github.sha }}.zip \
            --permissions r \
            --expiry "$EXPIRY" \
            --account-key "$ACCOUNT_KEY" \
            -o tsv)

          BLOB_URL="https://${{ env.STORAGE_ACCOUNT }}.blob.core.windows.net/${{ env.DEPLOY_CONTAINER }}/function-${{ github.sha }}.zip?${SAS}"

          az functionapp config appsettings set \
            --name ${{ vars.AZURE_FUNCTIONAPP_NAME }} \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --settings "WEBSITE_RUN_FROM_PACKAGE=${BLOB_URL}" \
            --output none

      - name: Restart Function App
        run: |
          az functionapp restart \
            --name ${{ vars.AZURE_FUNCTIONAPP_NAME }} \
            --resource-group ${{ env.RESOURCE_GROUP }}
