name: Deploy Function App

on:
  push:
    branches: [master]
    paths:
      - 'deployment/azure-function/**'
      - '.github/workflows/azure-function.yml'
  workflow_dispatch:

env:
  PROJECT_PATH: deployment/azure-function/Quanta.Forms.csproj
  DOTNET_VERSION: '10.0.x'
  PUBLISH_DIR: ${{ github.workspace }}/publish

permissions:
  id-token: write
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore ${{ env.PROJECT_PATH }}

      - name: Build
        run: dotnet build ${{ env.PROJECT_PATH }} -c Release --no-restore

      - name: Publish
        run: dotnet publish ${{ env.PROJECT_PATH }} -c Release --no-build -o ${{ env.PUBLISH_DIR }}

      - name: Zip publish output
        run: cd ${{ env.PUBLISH_DIR }} && zip -r ${{ github.workspace }}/function.zip .

      - name: Login to Azure (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy to Azure Functions
        run: |
          az functionapp deploy \
            --name ${{ vars.AZURE_FUNCTIONAPP_NAME }} \
            --resource-group GenericForms \
            --src-path ${{ github.workspace }}/function.zip \
            --type zip \
            --async false
